[project]
authors = [{name = "olmobaldoni", email = "olmo.baldoni@outlook.com"}]
dependencies = []
name = "pcd_segmentation"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = ">=3.11"
numpy = "*"
pyvista = "*"

[tool.pixi.pypi-dependencies]
pcd_segmentation = { path = ".", editable = true }
polyscope = ">=2.4.0"
laspy = "*"
lazrs = "*"

[tool.pixi.feature.dev.dependencies]
pytest = "*"
ruff = "*"
complexipy = "*"

[tool.pixi.environments]
default = { features = ["dev"], solve-group = "default" }

[tool.pixi.tasks]
segment = "python -m pcd_segmentation"
reference = "python -m pcd_segmentation.reference"
test = "pytest"
lint = "ruff check ."
format = "ruff format ."
complexity = "complexipy src/pcd_segmentation --max-complexity-allowed 10"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".pixi", "*.egg-info"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "D"]
ignore = ["D100", "D104", "D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"
